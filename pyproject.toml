[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "latentflow"
version = "0.1.0"
description = "BrainSteer / LatentFlow: steering de atención con SKOP, servidor FastAPI por WebSocket y cabina web."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
# transformers>=4.48: la atención eager devuelve sus pesos sin `output_attentions`
# (los lee la calibración Focus/Tail). accelerate: `device_map="auto"` al cargar.
models = ["transformers>=4.48", "accelerate>=0.26", "bitsandbytes"]
server = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "transformers>=4.48", "accelerate>=0.26"]
test = ["pytest>=7", "pytest-timeout", "httpx", "websockets>=12"]

[project.scripts]
latentflow-server = "latentflow.api.server:main"
latentflow-dev = "latentflow.tools.dev_backend:main"
latentflow-calibrate = "latentflow.tools.initializer:main"
latentflow-probe = "latentflow.tools.probe:main"
latentflow-eval = "latentflow.tools.evaluate:main"

[tool.setuptools.packages.find]
include = ["latentflow*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · motor, servidor, seguridad, calibración
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      # Wheel CPU de PyTorch: evita descargar ~2.5 GB de dependencias CUDA.
      - name: Instalar PyTorch (CPU)
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar latentflow (editable)
        run: python -m pip install -e ".[server,test]"

      - name: pytest
        run: python -m pytest -q

  frontend:
    name: Frontend · tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
